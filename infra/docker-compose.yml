include:
  - path: ./supabase/docker-compose.yml

services:
  web:
    build:
      context: ../apps/web
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # Overrides NEXT_PUBLIC_SUPABASE_URL for server-side use only (proxy.ts,
      # lib/supabase/server.ts): "localhost:8000" is the browser's route to
      # Kong (via the host's published port) but is unreachable from inside
      # this container, which must reach Kong by its Compose service name.
      SUPABASE_URL: http://kong:8000
    ports:
      - "3000:3000"

  api:
    build:
      context: ../
      dockerfile: apps/api/Dockerfile
    environment:
      # Container-internal DATABASE_URL - MUST be DATABASE_URL_INTERNAL, not
      # DATABASE_URL: "localhost" in the latter resolves to this container,
      # not the Docker host. See the .env / .env.example comments next to
      # both variables for the full rule.
      DATABASE_URL: ${DATABASE_URL_INTERNAL}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8001:8001"
    depends_on:
      # DATABASE_URL_INTERNAL routes through Supavisor (the pooler), not
      # straight to `db`, so wait on Supavisor's own healthcheck - it
      # already depends on `db: condition: service_healthy` itself, so this
      # transitively covers both. Plain `depends_on: - db` (start-order only)
      # let this container start before Supavisor was accepting connections
      # on a fast/cached `up`, and with no restart policy it stayed down.
      supavisor:
        condition: service_healthy

  worker:
    build:
      context: ../
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL_INTERNAL}
    depends_on:
      # See the matching comment on the api service above.
      supavisor:
        condition: service_healthy
    # Defensive backstop: worker/main.py connects eagerly and unretried at
    # process start (Task 9, already reviewed - not touched here). The
    # depends_on above should prevent the race in practice, but if Supavisor
    # is ever slow to report healthy for another reason, this makes the
    # container self-heal instead of staying down and needing manual
    # intervention (the plan's Definition of Done requires none).
    restart: on-failure

  caddy:
    image: caddy:2
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
    ports:
      - "80:80"
    depends_on:
      - web
      - api
