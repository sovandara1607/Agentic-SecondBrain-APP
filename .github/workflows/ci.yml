name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch/PR so pushes during review
# don't queue up redundant work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python lint + tests (api, worker, ai_core)
    runs-on: ubuntu-latest
    # apps/api/core/config.py's Settings has no defaults for
    # database_url/jwt_secret, and main.py reads get_settings() at
    # import time (for CORSMiddleware) - so even tests that never touch
    # a database (test_health.py, JWT-signature tests, etc.) fail to
    # import `main` at all without these present. DATABASE_URL is a
    # syntactically-valid but unreachable placeholder on purpose: the
    # conftest.py skip-guards in each suite already detect "can't
    # actually connect" and skip DB-integration tests accordingly, so
    # this only needs to satisfy pydantic validation, not point at a
    # real database. Neither value is a real secret.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      JWT_SECRET: ci-placeholder-not-a-real-secret
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync the uv workspace
        run: uv sync --all-packages

      # ruff.toml scopes this to Pyflakes only (see that file for why).
      - name: Lint (ruff)
        run: uvx ruff check .

      # No live Postgres in CI yet (spinning up the full self-hosted
      # Supabase stack - Postgres, GoTrue, Storage, Realtime - as a CI
      # job is a real follow-up, not bundled into this pass). Each
      # suite's conftest.py probes DATABASE_URL once and skips (loudly,
      # not silently) whichever tests actually need it when it's
      # unreachable, so this still runs every pure-logic test for real
      # (JWT verification, the webfetch SSRF guard, pipeline node logic,
      # etc.) instead of just checking that pytest collects.
      #
      # Run as three separate invocations, not one combined
      # `pytest apps/api packages/ai_core worker` - each directory has
      # its own tests/conftest.py, and pytest's default import mode
      # resolves all three to the same bare `tests.conftest` module
      # name when collected together, which pytest rejects as a
      # conflicting plugin registration (ImportPathMismatchError).
      # Matches how these already run locally, one project at a time.
      - name: Run tests (api)
        run: uv run pytest apps/api -q
      - name: Run tests (ai_core)
        run: uv run pytest packages/ai_core -q
      - name: Run tests (worker)
        run: uv run pytest worker -q

  web-build:
    name: Web lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  extension-build:
    name: Browser extension typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
