version: 2
updates:
  # apps/web (npm)
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10

  # apps/extension (npm) - its own package.json/lock, separate from web
  - package-ecosystem: "npm"
    directory: "/apps/extension"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10

  # The uv workspace root - covers apps/api, packages/ai_core, worker,
  # and the root pyproject.toml/uv.lock in one graph, matching how `uv
  # sync --all-packages` already treats them as one unit.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10

  # Keeps ci.yml/codeql.yml/docker-build.yml themselves from rotting -
  # pinned action versions (checkout, setup-uv, codeql-action, etc.).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
