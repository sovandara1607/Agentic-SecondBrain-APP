[project]
name = "ai-core"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=1.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ai_core"]
