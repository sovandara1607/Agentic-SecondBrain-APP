[project]
name = "second-brain-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "pyjwt[crypto]>=2.9",
    "psycopg[binary]>=3.2",
    "ai-core",
]

[tool.uv.sources]
ai-core = { workspace = true }

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]
