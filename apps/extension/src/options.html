<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Second Brain Capture - Setup</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        max-width: 440px;
        margin: 40px auto;
        padding: 0 20px;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #171717;
      }
      @media (prefers-color-scheme: dark) {
        body { color: #f5f5f5; background: #171717; }
        input { background: #262626; color: #f5f5f5; border-color: #404040; }
      }
      h1 { font-size: 18px; }
      p.hint { font-size: 13px; opacity: 0.75; }
      label { display: block; margin: 16px 0 4px; font-weight: 600; font-size: 13px; }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border: 1px solid #d4d4d4;
        border-radius: 6px;
        font: inherit;
      }
      button {
        margin-top: 18px;
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        background: #171717;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        button { background: #f5f5f5; color: #171717; }
      }
      #status { margin-top: 12px; font-size: 13px; }
      #status.error { color: #dc2626; }
      #status.ok { color: #16a34a; }
      code { background: rgba(127, 127, 127, 0.15); padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <h1>Second Brain Capture - Setup</h1>
    <p class="hint">
      Generate a personal access token from your Second Brain app's
      <strong>Settings &rarr; API tokens</strong> panel, then paste it below.
    </p>

    <label for="api-url">API URL</label>
    <input id="api-url" type="url" placeholder="https://api.yourdomain.com" />

    <label for="token">Personal access token</label>
    <input id="token" type="password" placeholder="sb_pat_..." autocomplete="off" />

    <button id="save-btn">Save</button>
    <p id="status"></p>
    <script type="module" src="options.js"></script>
  </body>
</html>
