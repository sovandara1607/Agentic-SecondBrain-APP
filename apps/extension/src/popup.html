<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Second Brain Capture</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        width: 300px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fff;
        color: #171717;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #171717; color: #f5f5f5; }
        textarea, input { background: #262626; color: #f5f5f5; border-color: #404040; }
      }
      h1 { font-size: 13px; font-weight: 600; margin: 0 0 10px; }
      .page-title { font-size: 12px; opacity: 0.7; margin: 0 0 10px; word-break: break-word; }
      textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: 60px;
        border: 1px solid #d4d4d4;
        border-radius: 6px;
        padding: 8px;
        font: inherit;
        resize: vertical;
      }
      button {
        margin-top: 10px;
        width: 100%;
        padding: 8px;
        border: none;
        border-radius: 6px;
        background: #171717;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        button { background: #f5f5f5; color: #171717; }
      }
      button:disabled { opacity: 0.5; cursor: default; }
      #status { margin-top: 8px; font-size: 12px; min-height: 16px; }
      #status.error { color: #dc2626; }
      #status.ok { color: #16a34a; }
      #setup-link { display: block; margin-top: 10px; font-size: 12px; text-align: center; }
    </style>
  </head>
  <body>
    <h1>Add to Second Brain</h1>
    <p class="page-title" id="page-title"></p>
    <textarea id="note" placeholder="Optional note (added alongside the page link)"></textarea>
    <button id="capture-btn">Capture this page</button>
    <p id="status"></p>
    <a id="setup-link" href="#">Set up API URL &amp; token</a>
    <script type="module" src="popup.js"></script>
  </body>
</html>
